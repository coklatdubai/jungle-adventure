<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 4 Wildlife Quest</title>
    <style>
        :root {
            --bg-color: #3d554a;
            --panel-color: #f7f3e9;
            --text-dark: #2c3e50;
            --accent-green: #27ae60;
            --accent-blue: #2980b9;
            --accent-orange: #d35400;
            --border-color: #bdc3c7;
        }

        * { box-sizing: border-box; font-family: 'Arial', sans-serif; user-select: none; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 700px;
            background: var(--panel-color);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* HEADER / HUD */
        #hud {
            padding: 12px 20px;
            background-color: #ecf0f1;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .hud-item { color: var(--text-dark); }
        .hud-item h2 { font-size: 16px; margin: 0; }
        .hud-item p { font-size: 14px; margin: 2px 0 0; color: #7f8c8d; }
        #score-display {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-blue);
        }

        /* GAME AREA */
        #game-area {
            flex-grow: 1;
            position: relative;
            background-color: #8fbc8f; /* Map background */
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default, shown for station 2 */
        }

        /* MAP SCREEN */
        #map-screen {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M 0 50 C 25 25, 75 25, 100 50 S 125 75, 150 50" stroke="%236b8e6b" stroke-width="2" fill="none"/></svg>');
            background-size: 50px 50px;
            padding: 20px;
            text-align: center;
        }
        
        .map-title {
            color: var(--text-dark);
            background: rgba(255,255,255,0.8);
            padding: 8px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .station-node {
            position: absolute;
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            border: 4px solid var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: var(--text-dark);
            text-align: center;
        }
        .station-node:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .station-node.completed {
            background-color: #2ecc71;
            color: white;
            border-color: var(--accent-green);
        }
        .station-node p { font-weight: bold; margin: 2px 0 0; font-size: 13px;}
        #station-1 { top: 20%; left: 15%; border-color: var(--accent-orange); }
        #station-2 { top: 50%; left: 45%; transform: translateX(-50%); border-color: var(--accent-blue); }
        #station-3 { top: 25%; right: 15%; border-color: var(--accent-green); }

        /* MODAL OVERLAY */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--panel-color);
            padding: 25px;
            border-radius: 8px;
            color: var(--text-dark);
            max-width: 95%;
            max-height: 95%;
            overflow-y: auto;
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; }

        /* INPUT SCREEN */
        #start-screen { display: flex; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input {
            width: 250px;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-start { background-color: var(--accent-blue); }
        .btn-start:hover { background-color: #3498db; }
        .btn-close { background-color: #e74c3c; margin-top: 15px; }
        .btn-close:hover { background-color: #c0392b; }

        /* STATION 1: WORD MATCH */
        #word-match-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .animal-picture-card { border: 2px solid var(--border-color); padding: 10px; border-radius: 5px; }
        .animal-picture-card img { max-width: 100px; }
        .drop-zone {
            margin-top: 10px;
            min-height: 40px;
            background: #ecf0f1;
            border: 2px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word-bank { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .word-tag {
            background: var(--accent-orange);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: grab;
        }
        .word-tag:active { cursor: grabbing; }

        /* STATION 2: SOUND SAFARI */
        #sound-safari-controls { margin-bottom: 15px; }

        /* STATION 3: HIDDEN OBJECT */
        #hidden-object-area {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border: 3px solid var(--border-color);
            position: relative;
            background-size: cover;
            cursor: crosshair;
        }
        .hidden-animal { position: absolute; cursor: pointer; transition: transform 0.2s; }
        .hidden-animal:hover { transform: scale(1.15); }
        .hidden-animal.found {
            filter: drop-shadow(0 0 5px lime) brightness(1.5);
            pointer-events: none;
        }

    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" style="display: none;">
        <div class="hud-item" id="player-info">
            <h2>Researcher Name</h2>
            <p>Class 4B</p>
        </div>
        <div class="hud-item">
            <h2>Score: <span id="score-display">0</span></h2>
        </div>
    </div>

    <div id="game-area">
        <div id="map-screen">
            <h2 class="map-title">Researcher's Map: Select a Station</h2>
            <div id="station-1" class="station-node">
                <p>Station 1</p>
                <span>Word Match</span>
            </div>
            <div id="station-2" class="station-node">
                <p>Station 2</p>
                <span>Sound Safari</span>
            </div>
            <div id="station-3" class="station-node">
                <p>Station 3</p>
                <span>Hidden Forest</span>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Modals -->
    <div id="start-screen" class="modal">
        <div class="modal-content">
            <h3>Welcome, Young Researcher!</h3>
            <p>Please enter your details to begin your quest.</p>
            <div class="input-group">
                <label for="name-input">Name:</label>
                <input type="text" id="name-input" placeholder="e.g., Ali">
            </div>
            <div class="input-group">
                <label for="class-input">Class:</label>
                <input type="text" id="class-input" placeholder="e.g., Year 4 Amanah">
            </div>
            <button id="start-game-btn" class="btn btn-start">Start Quest</button>
        </div>
    </div>

    <div id="mission-modal" class="modal">
        <div class="modal-content" id="modal-content-area">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

</div>

<script>
// --- GAME STATE & SETUP ---
const gameState = {
    playerName: '',
    playerClass: '',
    score: 0,
    stationsCompleted: [false, false, false],
    activeStation: -1,
};

// DOM Elements
const hud = document.getElementById('hud');
const playerInfoDiv = document.getElementById('player-info');
const scoreDisplay = document.getElementById('score-display');
const mapScreen = document.getElementById('map-screen');
const gameCanvas = document.getElementById('game-canvas');
const stationNodes = [document.getElementById('station-1'), document.getElementById('station-2'), document.getElementById('station-3')];
const missionModal = document.getElementById('mission-modal');
const modalContentArea = document.getElementById('modal-content-area');

// --- INITIALIZATION ---
document.getElementById('start-game-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('name-input').value;
    const classInput = document.getElementById('class-input').value;

    if (nameInput.trim() === '' || classInput.trim() === '') {
        alert('Please enter your name and class!');
        return;
    }

    gameState.playerName = nameInput;
    gameState.playerClass = classInput;

    playerInfoDiv.innerHTML = `<h2>${gameState.playerName}</h2><p>${gameState.playerClass}</p>`;
    scoreDisplay.textContent = gameState.score;

    document.getElementById('start-screen').style.display = 'none';
    hud.style.display = 'flex';
});

stationNodes.forEach((node, index) => {
    node.addEventListener('click', () => {
        if (gameState.stationsCompleted[index]) {
            alert('You have already completed this station!');
            return;
        }
        gameState.activeStation = index;
        startStation(index);
    });
});

// --- STATION LOGIC ---

function startStation(index) {
    if (index === 0) setupStation1();
    if (index === 1) setupStation2();
    if (index === 2) setupStation3();
}

function completeStation() {
    gameState.stationsCompleted[gameState.activeStation] = true;
    stationNodes[gameState.activeStation].classList.add('completed');
    missionModal.style.display = 'none';
    mapScreen.style.display = 'block';
    gameCanvas.style.display = 'none';

    // Check for game completion
    if (gameState.stationsCompleted.every(s => s === true)) {
        setTimeout(() => {
            alert(`Congratulations, ${gameState.playerName}! You have completed all stations with a final score of ${gameState.score}!`);
        }, 500);
    }
}

function updateScore(points) {
    gameState.score += points;
    scoreDisplay.textContent = gameState.score;
}

// --- STATION 1: WORD MATCH JIGSAW ---
function setupStation1() {
    const animals = [
        { name: 'Tiger', img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="%23f39c12"/><path d="M10 30h80 M10 50h80 M10 70h80" stroke="black" stroke-width="8"/></svg>' },
        { name: 'Monkey', img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="%23795548"/><path d="M70 60 C 70 80, 30 80, 30 60" fill="none" stroke="white" stroke-width="4"/></svg>' },
        { name: 'Snake', img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 80 C 30 20, 70 20, 90 80" stroke="%2327ae60" stroke-width="10" fill="none" stroke-linecap="round"/></svg>' },
        { name: 'Bird', img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="50" r="20" fill="%233498db"/><polygon points="60,50 90,30 90,70" fill="%23e74c3c"/></svg>' }
    ];
    let matches = 0;

    modalContentArea.innerHTML = `
        <h3>Station 1: Word Match</h3>
        <p>Drag the correct animal name to the box under its picture.</p>
        <div id="word-match-container"></div>
        <div class="word-bank" id="word-bank-s1"></div>
        <button class="btn btn-close">Close</button>
    `;

    const container = document.getElementById('word-match-container');
    const wordBank = document.getElementById('word-bank-s1');
    const shuffledAnimals = [...animals].sort(() => 0.5 - Math.random());
    const shuffledWords = [...animals].sort(() => 0.5 - Math.random());

    shuffledAnimals.forEach(animal => {
        container.innerHTML += `
            <div class="animal-picture-card">
                <img src="${animal.img}" alt="${animal.name}">
                <div class="drop-zone" data-animal="${animal.name}"></div>
            </div>
        `;
    });

    shuffledWords.forEach(animal => {
        const wordTag = document.createElement('div');
        wordTag.className = 'word-tag';
        wordTag.textContent = animal.name;
        wordTag.draggable = true;
        wordTag.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', animal.name);
        });
        wordBank.appendChild(wordTag);
    });

    document.querySelectorAll('.drop-zone').forEach(zone => {
        zone.addEventListener('dragover', e => e.preventDefault());
        zone.addEventListener('drop', e => {
            e.preventDefault();
            const droppedWord = e.dataTransfer.getData('text/plain');
            if (zone.dataset.animal === droppedWord && !zone.hasChildNodes()) {
                const wordElement = Array.from(document.querySelectorAll('.word-tag')).find(wt => wt.textContent === droppedWord);
                if (wordElement) {
                    zone.appendChild(wordElement);
                    wordElement.draggable = false;
                    wordElement.style.cursor = 'default';
                    updateScore(10);
                    matches++;
                    if (matches === animals.length) {
                        alert('Station 1 Complete! You earned 40 points.');
                        completeStation();
                    }
                }
            } else {
                alert('That is not the correct match. Try again!');
            }
        });
    });

    modalContentArea.querySelector('.btn-close').addEventListener('click', () => missionModal.style.display = 'none');
    missionModal.style.display = 'flex';
}

// --- STATION 2: SOUND SAFARI ---
let safariGame = null;
function setupStation2() {
    modalContentArea.innerHTML = `
        <h3>Station 2: Sound Safari</h3>
        <p>Listen to the animal sound. Then, use the arrow keys to walk your researcher to the correct animal!</p>
        <div id="sound-safari-controls">
            <button id="play-sound-btn" class="btn btn-start">Play Animal Sound</button>
        </div>
        <p>Close this window to begin exploring.</p>
    `;
    
    const animals = [
        { name: 'Elephant', sound: 'trumpet', pos: {x: 100, y: 100} },
        { name: 'Monkey', sound: 'chatter', pos: {x: 600, y: 400} },
        { name: 'Frog', sound: 'croak', pos: {x: 200, y: 450} }
    ];
    const targetAnimal = animals[Math.floor(Math.random() * animals.length)];

    document.getElementById('play-sound-btn').onclick = () => {
        // Simple sound simulation
        alert(`You hear a sound... it sounds like a ${targetAnimal.sound}!`);
        missionModal.style.display = 'none';
        mapScreen.style.display = 'none';
        gameCanvas.style.display = 'block';
        safariGame = new SafariInstance(animals, targetAnimal);
    };

    missionModal.style.display = 'flex';
}

class SafariInstance {
    constructor(animals, target) {
        this.ctx = gameCanvas.getContext('2d');
        this.player = { x: gameCanvas.width / 2, y: gameCanvas.height / 2, size: 20 };
        this.animals = animals;
        this.target = target;
        this.keys = {};
        this.isOver = false;

        window.addEventListener('keydown', this.keyHandler);
        window.addEventListener('keyup', this.keyHandler);
        this.update();
    }

    keyHandler = (e) => { this.keys[e.key] = e.type === 'keydown'; }

    update = () => {
        if (this.isOver) return;
        
        // Player movement
        if (this.keys['ArrowUp']) this.player.y -= 3;
        if (this.keys['ArrowDown']) this.player.y += 3;
        if (this.keys['ArrowLeft']) this.player.x -= 3;
        if (this.keys['ArrowRight']) this.player.x += 3;

        // Drawing
        this.ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
        this.ctx.fillStyle = '#6B8E23'; // Olive Drab
        this.ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

        // Draw animals
        this.animals.forEach(animal => {
            this.ctx.fillStyle = animal.name === this.target.name ? 'gold' : 'saddlebrown';
            this.ctx.fillRect(animal.pos.x, animal.pos.y, 40, 40);
            this.ctx.fillStyle = 'white';
            this.ctx.fillText(animal.name, animal.pos.x + 5, animal.pos.y - 5);

            // Collision check
            if (this.player.x < animal.pos.x + 40 && this.player.x + this.player.size > animal.pos.x &&
                this.player.y < animal.pos.y + 40 && this.player.y + this.player.size > animal.pos.y) {
                if (animal.name === this.target.name) {
                    this.endGame(true);
                } else {
                    this.endGame(false);
                }
            }
        });

        // Draw player
        this.ctx.fillStyle = 'blue';
        this.ctx.fillRect(this.player.x, this.player.y, this.player.size, this.player.size);

        requestAnimationFrame(this.update);
    }
    
    endGame(isCorrect) {
        this.isOver = true;
        window.removeEventListener('keydown', this.keyHandler);
        window.removeEventListener('keyup', this.keyHandler);
        if (isCorrect) {
            alert('Correct! You found the right animal!');
            updateScore(20);
        } else {
            alert('Oh no, that was the wrong animal!');
        }
        completeStation();
    }
}


// --- STATION 3: HIDDEN OBJECTS ---
function setupStation3() {
    const hiddenAnimals = [
        { name: 'Owl', pos: { top: '15%', left: '70%' }, size: '50px', found: false, img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="30" fill="saddlebrown"/><circle cx="35" cy="45" r="10" fill="yellow"/><circle cx="65" cy="45" r="10" fill="yellow"/></svg>' },
        { name: 'Squirrel', pos: { top: '60%', left: '20%' }, size: '40px', found: false, img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M30 90 C 10 70, 10 30, 40 20 C 70 10, 90 40, 70 60 C 90 80, 60 100, 30 90" fill="peru"/></svg>' },
        { name: 'Butterfly', pos: { top: '40%', left: '50%' }, size: '35px', found: false, img: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 50 L10 10 H 40 Z" fill="orange"/><path d="M50 50 L10 90 H 40 Z" fill="orange"/><path d="M50 50 L90 10 H 60 Z" fill="orange"/><path d="M50 50 L90 90 H 60 Z" fill="orange"/></svg>' }
    ];
    let foundCount = 0;

    modalContentArea.innerHTML = `
        <h3>Station 3: Hidden Forest</h3>
        <p>Find the ${hiddenAnimals.length} hidden animals in the forest scene. Click on them!</p>
        <div id="hidden-object-area"></div>
        <button class="btn btn-close">Close</button>
    `;

    const area = document.getElementById('hidden-object-area');
    // A dense, dark green background to simulate a forest
    area.style.backgroundImage = 'linear-gradient(45deg, #223a22 25%, transparent 25%), linear-gradient(-45deg, #223a22 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2c522c 75%), linear-gradient(-45deg, transparent 75%, #2c522c 75%)';
    area.style.backgroundSize = '20px 20px';
    area.style.backgroundColor = '#1e2b1e';

    hiddenAnimals.forEach(animal => {
        const el = document.createElement('img');
        el.src = animal.img;
        el.className = 'hidden-animal';
        el.style.top = animal.pos.top;
        el.style.left = animal.pos.left;
        el.style.width = animal.size;
        el.style.opacity = '0.7';

        el.addEventListener('click', () => {
            if (!animal.found) {
                animal.found = true;
                el.classList.add('found');
                foundCount++;
                updateScore(15);
                if (foundCount === hiddenAnimals.length) {
                    alert(`Station 3 Complete! You found all the animals and earned ${15 * hiddenAnimals.length} points.`);
                    completeStation();
                }
            }
        });
        area.appendChild(el);
    });
    
    modalContentArea.querySelector('.btn-close').addEventListener('click', () => missionModal.style.display = 'none');
    missionModal.style.display = 'flex';
}

// --- Start the game ---
window.onload = init;

</script>

</body>
</html>
